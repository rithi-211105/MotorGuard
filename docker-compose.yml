version: '3.8'

services:
  motorguard-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motorguard_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - motorguard_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  motorguard_data:
